<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- tab2roll: six tab strings turning into piano-roll notes -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#1f2937"/>
  <g stroke="#9ca3af" stroke-width="2" stroke-linecap="round">
    <line x1="10" y1="16" x2="30" y2="16"/>
    <line x1="10" y1="24" x2="30" y2="24"/>
    <line x1="10" y1="32" x2="30" y2="32"/>
    <line x1="10" y1="40" x2="30" y2="40"/>
    <line x1="10" y1="48" x2="30" y2="48"/>
  </g>
  <g fill="#f9fafb" font-family="monospace" font-size="9" font-weight="bold">
    <text x="14" y="27">3</text>
    <text x="22" y="43">0</text>
  </g>
  <g fill="#f59e0b">
    <rect x="36" y="12" width="18" height="6" rx="2"/>
    <rect x="36" y="22" width="10" height="6" rx="2"/>
    <rect x="42" y="32" width="12" height="6" rx="2"/>
    <rect x="36" y="42" width="8" height="6" rx="2"/>
    <rect x="46" y="42" width="8" height="6" rx="2"/>
  </g>
</svg>
