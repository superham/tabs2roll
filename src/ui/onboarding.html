<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-str="onboarding.title">tab2roll is ready</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img src="../icons/icon.svg" alt="" />
        <h1 data-str="onboarding.title"></h1>
      </header>
      <p class="lead" data-str="onboarding.intro"></p>

      <h2 data-str="onboarding.pinHeading"></h2>
      <div class="big-step"><span class="num">1</span><p data-str="onboarding.step1"></p></div>
      <div class="big-step"><span class="num">2</span><p data-str="onboarding.step2"></p></div>
      <div class="big-step"><span class="num">3</span><p data-str="onboarding.step3"></p></div>

      <figure>
        <!-- Illustration of the Firefox toolbar: the puzzle-piece Extensions
             button, the panel it opens, and the "Pin to Toolbar" item.
             TODO: replace with a real screenshot (docs/screenshots/pin.png). -->
        <svg viewBox="0 0 640 300" role="img" aria-labelledby="pin-title">
          <title id="pin-title">Firefox toolbar with the Extensions panel open and "Pin to Toolbar" highlighted</title>
          <rect x="0" y="0" width="640" height="300" fill="#f3f4f6" />
          <!-- toolbar -->
          <rect x="0" y="0" width="640" height="48" fill="#e5e7eb" />
          <rect x="16" y="12" width="24" height="24" rx="4" fill="#9ca3af" />
          <rect x="52" y="12" width="24" height="24" rx="4" fill="#9ca3af" />
          <rect x="92" y="10" width="420" height="28" rx="14" fill="#ffffff" stroke="#d1d5db" />
          <text x="108" y="29" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">tabs.ultimate-guitar.com/…</text>
          <!-- puzzle piece button -->
          <rect x="560" y="8" width="32" height="32" rx="6" fill="#d97706" />
          <path d="M569 18h6a2 2 0 1 1 4 0h5v6a2 2 0 1 1 0 4v5h-5a2 2 0 1 1 -4 0h-6v-5a2 2 0 1 1 0 -4z" fill="#fff7ed" />
          <text x="596" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">Extensions</text>
          <!-- panel -->
          <rect x="360" y="56" width="264" height="132" rx="10" fill="#ffffff" stroke="#d1d5db" />
          <text x="376" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#111827">Extensions</text>
          <rect x="376" y="96" width="18" height="18" rx="4" fill="#1f2937" />
          <rect x="380" y="101" width="6" height="8" fill="#f59e0b" />
          <text x="402" y="110" font-family="system-ui, sans-serif" font-size="13" fill="#111827">tab2roll</text>
          <!-- gear -->
          <circle cx="596" cy="105" r="9" fill="#e5e7eb" stroke="#6b7280" />
          <circle cx="596" cy="105" r="3" fill="#6b7280" />
          <!-- pin menu -->
          <rect x="430" y="122" width="190" height="56" rx="8" fill="#ffffff" stroke="#d1d5db" />
          <rect x="434" y="128" width="182" height="22" rx="6" fill="#fde68a" />
          <text x="446" y="143" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">Pin to Toolbar</text>
          <text x="446" y="167" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Manage Extension</text>
          <!-- arrow from gear to menu -->
          <path d="M596 116 L596 128" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)" />
          <defs>
            <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
              <path d="M0 0 L8 4 L0 8 z" fill="#b45309" />
            </marker>
          </defs>
          <!-- result -->
          <text x="24" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Afterwards the tab2roll icon sits in the toolbar:</text>
          <rect x="24" y="244" width="300" height="40" rx="8" fill="#e5e7eb" />
          <rect x="36" y="252" width="24" height="24" rx="4" fill="#9ca3af" />
          <rect x="72" y="252" width="24" height="24" rx="5" fill="#1f2937" />
          <rect x="77" y="258" width="6" height="8" fill="#f59e0b" />
          <rect x="86" y="262" width="6" height="8" fill="#f59e0b" />
          <rect x="108" y="252" width="24" height="24" rx="4" fill="#9ca3af" />
        </svg>
        <figcaption data-str="onboarding.figureCaption"></figcaption>
      </figure>

      <h2 data-str="onboarding.howHeading"></h2>
      <ol>
        <li data-str="onboarding.how1"></li>
        <li data-str="onboarding.how2"></li>
        <li data-str="onboarding.how3"></li>
        <li data-str="onboarding.how4"></li>
      </ol>

      <h2 data-str="onboarding.privacyHeading"></h2>
      <p data-str="onboarding.privacy"></p>

      <p><a href="help.html" data-str="onboarding.helpLink"></a></p>
    </div>
    <script type="module" src="page.js"></script>
  </body>
</html>
