        <!-- Illustration: Downloads folder window on the left, FL Studio
             playlist on the right, a file being dragged across.
             TODO: replace with a real screenshot (docs/screenshots/drag.png). -->
        <svg viewBox="0 0 640 300" role="img" aria-labelledby="drag-title">
          <title id="drag-title">Dragging the MIDI file from the Downloads folder onto the FL Studio playlist</title>
          <rect x="0" y="0" width="640" height="300" fill="#f3f4f6" />
          <!-- file window -->
          <rect x="16" y="24" width="270" height="250" rx="10" fill="#ffffff" stroke="#d1d5db" />
          <rect x="16" y="24" width="270" height="34" rx="10" fill="#e5e7eb" />
          <text x="32" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#111827">Downloads</text>
          <g font-family="system-ui, sans-serif" font-size="13" fill="#374151">
            <text x="32" y="86">photo.jpg</text>
            <text x="32" y="112">setup.exe</text>
          </g>
          <rect x="24" y="124" width="254" height="26" rx="6" fill="#fde68a" />
          <text x="32" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#78350f">Artist - Song (tab).mid</text>
          <!-- DAW window -->
          <rect x="330" y="24" width="294" height="250" rx="10" fill="#1f2937" stroke="#111827" />
          <rect x="330" y="24" width="294" height="34" rx="10" fill="#111827" />
          <text x="346" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#f9fafb">Playlist</text>
          <g stroke="#374151" stroke-width="1">
            <line x1="330" y1="96" x2="624" y2="96" />
            <line x1="330" y1="136" x2="624" y2="136" />
            <line x1="330" y1="176" x2="624" y2="176" />
            <line x1="330" y1="216" x2="624" y2="216" />
          </g>
          <rect x="410" y="104" width="120" height="24" rx="4" fill="#f59e0b" opacity="0.9" />
          <text x="418" y="121" font-family="system-ui, sans-serif" font-size="12" fill="#111827">Guitar (as tabbed)</text>
          <rect x="410" y="144" width="120" height="24" rx="4" fill="#60a5fa" opacity="0.9" />
          <text x="418" y="161" font-family="system-ui, sans-serif" font-size="12" fill="#111827">Chords</text>
          <rect x="410" y="184" width="120" height="24" rx="4" fill="#34d399" opacity="0.9" />
          <text x="418" y="201" font-family="system-ui, sans-serif" font-size="12" fill="#111827">Bass</text>
          <!-- drag arrow -->
          <path d="M282 137 C 320 137, 340 116, 404 116" stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow2)" />
          <defs>
            <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
              <path d="M0 0 L10 5 L0 10 z" fill="#b45309" />
            </marker>
          </defs>
        </svg>
